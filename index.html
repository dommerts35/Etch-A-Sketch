<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etch A Sketch</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">🎨 Etch A Sketch</header>

  <main class="content">
    <aside class="options">
      <button class="btn" id="gridSize">🧩 Change Grid Size</button>
      <button class="btn active" id="defaultMode">Default Mode</button>
      <button class="btn" id="colorfulMode">Colorful Mode</button>
      <button class="btn" id="shadeMode">Shading Mode</button>
      <button class="btn" id="clearBoard">🧹 Clear Board</button>
    </aside>

    <section class="sketchpad"></section>
  </main>

  <footer class="footer">© TheOdinProject 2025 — Improved by You ✨</footer>
</body>
</html>
